<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Uji race condition: 12 checkout serentak atas stok 10 menghasilkan tepat 10 berhasil, 2 ditolak, dan stok akhir 0.">
  <title>Uji race condition — 12 checkout, stok 10</title>
