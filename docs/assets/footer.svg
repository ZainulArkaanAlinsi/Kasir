<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-label="KasirOne — cepat di kasir, jujur di pembukuan.">
  <title>KasirOne</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12151c"/>
      <stop offset="1" stop-color="#08090c"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b52"/>
      <stop offset="1" stop-color="#ff2e43"/>
    </linearGradient>
    <linearGradient id="waveA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2e43" stop-opacity=".2"/>
      <stop offset="1" stop-color="#ff2e43" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="waveB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b52" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ff6b52" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".38"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edgeTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="210" rx="24"/></clipPath>
    <style>
      text { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
      .wa { animation: wave 9s linear infinite; }
      .wb { animation: wave 13s linear infinite reverse; }
      @keyframes wave { from { transform: translateX(0) } to { transform: translateX(-300px) } }
      .logo { animation: float 5s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-4px) } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="210" fill="url(#bg)"/>
    <path class="wb" fill="url(#waveB)" d="M0 150 Q75 128 150 150 T300 150 T450 150 T600 150 T750 150 T900 150 T1050 150 T1200 150 T1350 150 T1500 150 V210 H0Z"/>
    <path class="wa" fill="url(#waveA)" d="M0 166 Q75 146 150 166 T300 166 T450 166 T600 166 T750 166 T900 166 T1050 166 T1200 166 T1350 166 T1500 166 V210 H0Z"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="209" rx="23.5" fill="none" stroke="#fff" stroke-opacity=".08"/>
  <rect x="200" y="0" width="800" height="1" fill="url(#edgeTop)"/>

  <g class="logo">
    <g transform="translate(578 34)">
      <rect width="44" height="44" rx="13" fill="url(#brand)"/>
      <rect width="44" height="44" rx="13" fill="url(#gloss)"/>
      <g transform="scale(.25) translate(-40 -40)" fill="none" stroke="#fff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M98 82v94"/><path d="M160 82l-54 52"/><path d="M124 118l38 58"/>
      </g>
    </g>
  </g>
  <text x="600" y="112" text-anchor="middle" font-size="20" font-weight="800" fill="#eef1f6" letter-spacing="-.3">Kasir<tspan fill="#ff6b52">One</tspan></text>
  <text x="600" y="138" text-anchor="middle" font-size="14" fill="#8a93a6">Cepat di kasir, jujur di pembukuan — dibuat dengan <tspan fill="#ff2e43">♥</tspan> untuk toko retail Indonesia</text></svg>
