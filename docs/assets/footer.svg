<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="KasirOne — terima kasih. Cepat di kasir, jujur di pembukuan.">
  <title>KasirOne — terima kasih</title>
  <defs>
    <filter id="paper" x="-5%" y="-20%" width="110%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#17150f" flood-opacity=".08"/>
    </filter>
    <path id="mark" d="M48 72 Q48 36 84 36 H172 Q208 36 208 72 V208 L198 220 L188 208 L178 220 L168 208 L158 220 L148 208 L138 220 L128 208 L118 220 L108 208 L98 220 L88 208 L78 220 L68 208 L58 220 L48 208 Z"/>
    <clipPath id="bc"><rect x="470" y="160" width="260" height="30"/></clipPath>
    <style>
      .serif { font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif; }
      .sans  { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
      .mono  { font-family: 'SFMono-Regular', 'Cascadia Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
      .laser { animation: laser 2.6s ease-in-out infinite; }
      @keyframes laser { 0% { transform: translateX(-20px); opacity: 0 } 10%, 90% { opacity: 1 } 100% { transform: translateX(280px); opacity: 0 } }
      .star { animation: star 2.4s ease-in-out infinite; }
      .star2 { animation-delay: .4s } .star3 { animation-delay: .8s }
      @keyframes star { 0%, 100% { fill-opacity: .25 } 50% { fill-opacity: 1 } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important } .laser { opacity: 0 } }
    </style>
  </defs>

  <!-- ujung struk: tepi atas disobek, bawah membulat -->
