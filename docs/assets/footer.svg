  <text class="mono" x="600" y="76" font-size="13" font-weight="800" fill="#17150f" text-anchor="middle" letter-spacing="5"><tspan class="star" fill="#ec2a3f">*</tspan>  <tspan class="star star2" fill="#ec2a3f">*</tspan>  TERIMA KASIH  <tspan class="star star2" fill="#ec2a3f">*</tspan>  <tspan class="star star3" fill="#ec2a3f">*</tspan></text>

