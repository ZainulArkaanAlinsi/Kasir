<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="Alur checkout: browser hanya mengirim productId dan qty, server menghitung ulang di dalam satu Firestore transaction, dan Security Rules menolak penulisan langsung dari browser.">
  <title>Browser tidak dipercaya — alur checkout KasirOne</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12151c"/>
      <stop offset="1" stop-color="#08090c"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b52"/>
      <stop offset="1" stop-color="#ff2e43"/>
    </linearGradient>
    <linearGradient id="edgeTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".08"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".08"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <clipPath id="frame"><rect width="1200" height="430" rx="24"/></clipPath>

    <style>
      text { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace; }
      .ttl { font-size: 20px; font-weight: 700; fill: #eef1f6; }
      .sub { font-size: 13px; fill: #8a93a6; }

      .ok   { animation: ok 6s cubic-bezier(.45,0,.25,1) infinite; }
      .bad  { animation: bad 6s cubic-bezier(.45,0,.25,1) infinite; }
      .tx   { animation: tx 6s cubic-bezier(.45,0,.25,1) infinite; }
      .xA   { opacity: 0; animation: xA 6s ease-out infinite; }
      @keyframes ok  { 0% { transform: translateX(0); opacity: 0 } 4% { opacity: 1 } 32% { opacity: 1 } 36%,100% { transform: translateX(132px); opacity: 0 } }
      @keyframes bad { 0%,4% { transform: translateX(0) scale(1); opacity: 0 } 8% { opacity: 1 } 28% { transform: translateX(58px); opacity: 1 } 34%,100% { transform: translateX(58px); opacity: 0 } }
      @keyframes xA  { 0%,27% { opacity: 0; transform: scale(.4) } 31% { opacity: 1; transform: scale(1.15) } 34%,48% { opacity: 1; transform: scale(1) } 55%,100% { opacity: 0 } }
      @keyframes tx  { 0%,38% { transform: translateX(0); opacity: 0 } 42% { opacity: 1 } 70% { opacity: 1 } 74%,100% { transform: translateX(132px); opacity: 0 } }
      .xA { transform-box: fill-box; transform-origin: center; }

      .n-srv  { animation: nSrv 6s ease-in-out infinite; }
      .n-db   { animation: nDb 6s ease-in-out infinite; }
      @keyframes nSrv { 0%,30% { stroke-opacity: .12 } 36%,46% { stroke-opacity: .7 } 56%,100% { stroke-opacity: .12 } }
      @keyframes nDb  { 0%,70% { stroke-opacity: .12 } 76%,90% { stroke-opacity: .7 } 100% { stroke-opacity: .12 } }

      .s1, .s2, .s3, .s4 { opacity: 0; }
      .s1 { animation: s1 6s ease-in-out infinite; }
      .s2 { animation: s2 6s ease-in-out infinite; }
      .s3 { animation: s3 6s ease-in-out infinite; }
      .s4 { animation: s4 6s ease-in-out infinite; }
      @keyframes s1 { 0%,38% { opacity: 0 } 43%,54% { opacity: 1 } 60%,100% { opacity: 0 } }
      @keyframes s2 { 0%,50% { opacity: 0 } 55%,66% { opacity: 1 } 72%,100% { opacity: 0 } }
      @keyframes s3 { 0%,62% { opacity: 0 } 67%,78% { opacity: 1 } 84%,100% { opacity: 0 } }
      @keyframes s4 { 0%,74% { opacity: 0 } 79%,92% { opacity: 1 } 98%,100% { opacity: 0 } }

      .shield { animation: shield 6s ease-out infinite; }
      @keyframes shield { 0%,36% { opacity: .55 } 40%,50% { opacity: 1 } 62%,100% { opacity: .55 } }
      .dash { animation: dash 1.4s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -18 } }
      .orb { animation: orb 18s ease-in-out infinite alternate; }
      @keyframes orb { to { transform: translate(-220px, 40px) } }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .s1 { opacity: 1 !important; }
        .ok, .bad, .tx { opacity: 0 !important; }
      }
    </style>
  </defs>

  <!-- latar -->
  <g clip-path="url(#frame)">
    <rect width="1200" height="430" fill="url(#bg)"/>
    <circle class="orb" cx="980" cy="380" r="200" fill="#ff2e43" opacity=".14" filter="url(#blur)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="429" rx="23.5" fill="none" stroke="#fff" stroke-opacity=".08"/>
  <rect x="100" y="0" width="1000" height="1" fill="url(#edgeTop)"/>

  <text x="48" y="48" font-size="12" font-weight="700" fill="#ff8a6b" letter-spacing="1.8">ALUR CHECKOUT</text>

  <!-- ── jalur terlarang: browser → firestore langsung ── -->
  <path class="dash" d="M188 140 C188 96 230 80 300 80 H900 C970 80 1012 96 1012 140" fill="none" stroke="#ff4d5e" stroke-opacity=".45" stroke-width="1.5" stroke-dasharray="6 12"/>
  <circle r="5" fill="#ff4d5e">
    <animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;.38;1" path="M188 140 C188 96 230 80 300 80 H586"/>
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;.05;.36;.42;1"/>
  </circle>
  <circle r="5" fill="#ff4d5e" filter="url(#glow)">
    <animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;.38;1" path="M188 140 C188 96 230 80 300 80 H586"/>
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;.05;.36;.42;1"/>
  </circle>
  <g class="shield">
    <circle cx="600" cy="80" r="20" fill="#12151c" stroke="#ff4d5e" stroke-opacity=".7" stroke-width="1.5"/>
    <path d="M600 68l9 3.5v7c0 6-4 10-9 12-5-2-9-6-9-12v-7z" fill="#ff4d5e" fill-opacity=".18" stroke="#ff4d5e" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M596.5 76.5l7 7M603.5 76.5l-7 7" stroke="#ff4d5e" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <text x="626" y="76" font-size="12.5" font-weight="700" fill="#ff8a8f">Security Rules</text>
  <text x="626" y="93" font-size="12" fill="#8a93a6">tulis langsung dari browser ditolak</text>

  <!-- ── node: browser ── -->
  <g>
    <rect x="48" y="140" width="280" height="120" rx="18" fill="#fff" fill-opacity=".045" stroke="#fff" stroke-opacity=".12"/>
    <rect x="72" y="164" width="44" height="44" rx="12" fill="#ff2e43" fill-opacity=".14" stroke="#ff2e43" stroke-opacity=".3"/>
    <g fill="none" stroke="#ff8a6b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="82" y="175" width="24" height="20" rx="3.5"/><path d="M82 181h24"/>
    </g>
    <circle cx="86" cy="178" r=".9" fill="#ff8a6b"/><circle cx="89.5" cy="178" r=".9" fill="#ff8a6b"/>
    <text class="ttl" x="132" y="184">Browser</text>
    <text class="sub" x="132" y="204">Kasir · Etalase pembeli</text>
    <rect x="72" y="222" width="150" height="24" rx="8" fill="#000" fill-opacity=".35" stroke="#fff" stroke-opacity=".08"/>
    <text class="mono" x="84" y="238.5" font-size="12" fill="#b6becd">{ productId, qty }</text>
  </g>

  <!-- ── node: server ── -->
  <g>
    <rect class="n-srv" x="460" y="140" width="280" height="120" rx="18" fill="#fff" fill-opacity=".045" stroke="#ff6b52" stroke-opacity=".12" stroke-width="1.5"/>
    <rect x="484" y="164" width="44" height="44" rx="12" fill="#ff2e43" fill-opacity=".14" stroke="#ff2e43" stroke-opacity=".3"/>
    <g fill="none" stroke="#ff8a6b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="494" y="174" width="24" height="10" rx="3"/><rect x="494" y="188" width="24" height="10" rx="3"/>
    </g>
    <circle cx="499" cy="179" r="1.2" fill="#2fe0a4"/><circle cx="499" cy="193" r="1.2" fill="#2fe0a4"/>
    <text class="ttl" x="544" y="184">Server</text>
    <text class="sub" x="544" y="204">Express 5 · server/services</text>
    <rect x="484" y="222" width="138" height="24" rx="8" fill="#2fe0a4" fill-opacity=".1" stroke="#2fe0a4" stroke-opacity=".3"/>
    <text class="mono" x="496" y="238.5" font-size="12" fill="#2fe0a4">token + role ✓</text>
  </g>

  <!-- ── node: firestore ── -->
  <g>
    <rect class="n-db" x="872" y="140" width="280" height="120" rx="18" fill="#fff" fill-opacity=".045" stroke="#ff6b52" stroke-opacity=".12" stroke-width="1.5"/>
    <rect x="896" y="164" width="44" height="44" rx="12" fill="#ff2e43" fill-opacity=".14" stroke="#ff2e43" stroke-opacity=".3"/>
    <g fill="none" stroke="#ff8a6b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="918" cy="176" rx="11" ry="4"/>
      <path d="M907 176v20c0 2.2 4.9 4 11 4s11-1.8 11-4v-20"/>
      <path d="M907 186c0 2.2 4.9 4 11 4s11-1.8 11-4"/>
    </g>
    <text class="ttl" x="956" y="184">Firestore</text>
    <text class="sub" x="956" y="204">satu transaction atomik</text>
    <rect x="896" y="222" width="232" height="24" rx="8" fill="#000" fill-opacity=".35" stroke="#fff" stroke-opacity=".08"/>
    <text class="mono" x="908" y="238.5" font-size="12" fill="#b6becd">tersedia = stok − stokDipesan</text>
  </g>

  <!-- ── kabel browser → server ── -->
  <rect x="328" y="199.5" width="132" height="1" fill="url(#wire)"/>
  <text x="394" y="188" font-size="11.5" font-weight="600" fill="#2fe0a4" text-anchor="middle">productId + qty</text>
  <g class="ok">
    <circle cx="328" cy="200" r="7" fill="#2fe0a4" opacity=".45" filter="url(#glow)"/>
    <circle cx="328" cy="200" r="4.5" fill="#2fe0a4"/>
  </g>
  <text x="394" y="226" font-size="11.5" font-weight="600" fill="#ff8a8f" text-anchor="middle">harga / total</text>
  <g class="bad">
    <circle cx="334" cy="212" r="4" fill="#ff4d5e"/>
  </g>
  <g class="xA">
    <circle cx="392" cy="212" r="8" fill="#ff4d5e" fill-opacity=".2"/>
    <path d="M388.5 208.5l7 7M395.5 208.5l-7 7" stroke="#ff4d5e" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- ── kabel server → firestore ── -->
  <rect x="740" y="199.5" width="132" height="1" fill="url(#wire)"/>
  <text x="806" y="188" font-size="11.5" font-weight="600" fill="#ff8a6b" text-anchor="middle" class="mono">runTransaction</text>
  <g class="tx">
    <circle cx="740" cy="200" r="7" fill="#ff2e43" opacity=".5" filter="url(#glow)"/>
    <rect x="735" y="195" width="10" height="10" rx="2.5" fill="url(#brand)"/>
  </g>

  <!-- ── langkah di dalam transaction ── -->
  <text x="48" y="298" font-size="12" font-weight="700" fill="#8a93a6" letter-spacing="1.6">DI DALAM SATU FIRESTORE TRANSACTION</text>
  <g font-size="14.5" fill="#eef1f6">
    <g>
      <rect x="48" y="312" width="264" height="54" rx="14" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".1"/>
      <rect class="s1" x="48" y="312" width="264" height="54" rx="14" fill="#ff2e43" fill-opacity=".1" stroke="#ff6b52" stroke-opacity=".8"/>
      <text class="mono" x="68" y="344" font-size="13" font-weight="700" fill="#ff6b52">01</text>
      <text x="100" y="344">Baca harga dari database</text>
    </g>
    <g>
      <rect x="328" y="312" width="264" height="54" rx="14" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".1"/>
      <rect class="s2" x="328" y="312" width="264" height="54" rx="14" fill="#ff2e43" fill-opacity=".1" stroke="#ff6b52" stroke-opacity=".8"/>
      <text class="mono" x="348" y="344" font-size="13" font-weight="700" fill="#ff6b52">02</text>
      <text x="380" y="344">Hitung ulang diskon &amp; pajak</text>
    </g>
    <g>
      <rect x="608" y="312" width="264" height="54" rx="14" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".1"/>
      <rect class="s3" x="608" y="312" width="264" height="54" rx="14" fill="#ff2e43" fill-opacity=".1" stroke="#ff6b52" stroke-opacity=".8"/>
      <text class="mono" x="628" y="344" font-size="13" font-weight="700" fill="#ff6b52">03</text>
      <text x="660" y="344">Cek stok yang tersedia</text>
    </g>
    <g>
      <rect x="888" y="312" width="264" height="54" rx="14" fill="#fff" fill-opacity=".04" stroke="#fff" stroke-opacity=".1"/>
      <rect class="s4" x="888" y="312" width="264" height="54" rx="14" fill="#2fe0a4" fill-opacity=".1" stroke="#2fe0a4" stroke-opacity=".8"/>
      <text class="mono" x="908" y="344" font-size="13" font-weight="700" fill="#2fe0a4">04</text>
      <text x="940" y="344">Kurangi stok &amp; simpan</text>
    </g>
  </g>

  <!-- legenda -->
  <g font-size="12.5" fill="#8a93a6">
    <circle cx="54" cy="398" r="4.5" fill="#2fe0a4"/><text x="66" y="402.5">diterima</text>
    <circle cx="148" cy="398" r="4.5" fill="#ff4d5e"/><text x="160" y="402.5">ditolak</text>
    <rect x="231" y="393" width="10" height="10" rx="2.5" fill="url(#brand)"/><text x="248" y="402.5">transaksi atomik — semua tersimpan, atau tidak sama sekali</text>
  </g>
</svg>
