<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="36" viewBox="0 0 1200 36" role="img" aria-hidden="true">
  <defs>
    <style>
      /* Gunting kecil berjalan di sepanjang garis potong struk */
      .walk  { animation: walk 11s linear infinite; }
      @keyframes walk { from { transform: translateX(-60px) } to { transform: translateX(1240px) } }
      .bladeA { transform-origin: 14px 18px; animation: snipA .42s ease-in-out infinite alternate; }
      .bladeB { transform-origin: 14px 18px; animation: snipB .42s ease-in-out infinite alternate; }
      @keyframes snipA { from { transform: rotate(-14deg) } to { transform: rotate(-2deg) } }
      @keyframes snipB { from { transform: rotate(14deg) } to { transform: rotate(2deg) } }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .walk { transform: translateX(586px); }
      }
    </style>
  </defs>
  <line x1="0" y1="18" x2="1200" y2="18" stroke="#a39c8f" stroke-width="1.2" stroke-dasharray="6 7"/>
  <g class="walk">
    <g transform="translate(0 0)">
      <g class="bladeA">
        <path d="M14 18 L40 15.5" stroke="#ec2a3f" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="7" cy="12" r="5" fill="none" stroke="#ec2a3f" stroke-width="2.2"/>
        <path d="M10.5 15 L14 18" stroke="#ec2a3f" stroke-width="2.2" stroke-linecap="round"/>
      </g>
      <g class="bladeB">
        <path d="M14 18 L40 20.5" stroke="#ec2a3f" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="7" cy="24" r="5" fill="none" stroke="#ec2a3f" stroke-width="2.2"/>
        <path d="M10.5 21 L14 18" stroke="#ec2a3f" stroke-width="2.2" stroke-linecap="round"/>
      </g>
      <circle cx="14" cy="18" r="1.6" fill="#ec2a3f"/>
    </g>
  </g>
</svg>
