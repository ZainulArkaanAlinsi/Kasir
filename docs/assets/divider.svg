<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="28" viewBox="0 0 1200 28" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2e43" stop-opacity="0"/>
      <stop offset=".35" stop-color="#ff6b52" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#ff2e43" stop-opacity=".9"/>
      <stop offset=".65" stop-color="#ff6b52" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff2e43" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb3a6" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffd9d2" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffb3a6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b52"/>
      <stop offset="1" stop-color="#ff2e43"/>
    </linearGradient>
    <style>
      .glint { animation: run 4.5s cubic-bezier(.55,0,.25,1) infinite; }
      @keyframes run { 0% { transform: translateX(-160px); opacity: 0 } 15%, 85% { opacity: 1 } 100% { transform: translateX(1200px); opacity: 0 } }
      .gem { transform-origin: 600px 14px; animation: spin 9s linear infinite; }
      @keyframes spin { from { transform: rotate(45deg) } to { transform: rotate(405deg) } }
      .ring { transform-origin: 600px 14px; animation: ring 2.8s ease-out infinite; }
      @keyframes ring { from { transform: scale(.6); opacity: .7 } to { transform: scale(1.9); opacity: 0 } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important } .glint, .ring { opacity: 0 } }
    </style>
  </defs>
  <rect x="0" y="13.5" width="1200" height="1" fill="url(#line)"/>
  <rect class="glint" x="0" y="13" width="160" height="2" rx="1" fill="url(#glint)"/>
  <circle class="ring" cx="600" cy="14" r="8" fill="none" stroke="#ff2e43" stroke-width="1.2"/>
  <rect class="gem" x="594" y="8" width="12" height="12" rx="3" fill="url(#gem)" transform="rotate(45 600 14)"/>
</svg>
