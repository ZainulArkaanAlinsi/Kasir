<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="516" viewBox="0 0 1200 516" role="img" aria-label="Enam fitur utama KasirOne: scan barcode, transaksi atomik, QRIS jujur, laporan laba, etalase online, dan stok terkunci.">
  <title>Fig. 2 — Fitur utama KasirOne</title>
  <defs>
    <filter id="card" x="-5%" y="-10%" width="110%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17150f" flood-opacity=".06"/>
    </filter>
    <clipPath id="c1"><rect x="4" y="4" width="28" height="28"/></clipPath>
    <style>
      .serif { font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif; }
      .sans  { font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
      .mono  { font-family: 'SFMono-Regular', 'Cascadia Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
      .no { font-size: 10.5px; font-weight: 700; fill: #ec2a3f; letter-spacing: 2px; }
      .t  { font-size: 25px; fill: #17150f; }
      .d  { font-size: 14.5px; fill: #4a463e; }
      .g  { font-size: 11px; fill: #857f73; letter-spacing: .4px; }
      .ic { fill: none; stroke: #17150f; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

      .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
      .r1 { animation-delay: .25s } .r2 { animation-delay: .37s } .r3 { animation-delay: .49s }
      .r4 { animation-delay: .61s } .r5 { animation-delay: .73s } .r6 { animation-delay: .85s }
      @keyframes rise { from { opacity: 0; transform: translateY(12px) } to { opacity: 1; transform: none } }
      .vl { transform-box: fill-box; transform-origin: 50% 0; transform: scaleY(0); animation: grow 1.1s .1s cubic-bezier(.6,0,.2,1) forwards; }
      .hl { transform-box: fill-box; transform-origin: 0 50%; transform: scaleX(0); animation: growX 1.1s .1s cubic-bezier(.6,0,.2,1) forwards; }
      @keyframes grow  { to { transform: scaleY(1) } }
      @keyframes growX { to { transform: scaleX(1) } }

      .laser { animation: laser 1.4s ease-in-out infinite alternate; }
      @keyframes laser { from { transform: translateY(0) } to { transform: translateY(22px) } }
      .shackle { animation: shackle 3.2s cubic-bezier(.5,0,.2,1) infinite; }
      @keyframes shackle { 0%, 20% { transform: translateY(-4px) } 35%, 85% { transform: translateY(0) } 100% { transform: translateY(-4px) } }
      .key { animation: key 3.2s ease-in-out infinite; }
      @keyframes key { 0%, 30% { fill: #857f73 } 38%, 85% { fill: #ec2a3f } 100% { fill: #857f73 } }
      .qscan { animation: qscan 2.4s ease-in-out infinite; }
      @keyframes qscan { 0% { transform: translateY(0); opacity: 0 } 15%, 85% { opacity: 1 } 100% { transform: translateY(26px); opacity: 0 } }
      .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: bar 3s cubic-bezier(.3,0,.2,1) infinite; }
      .b2 { animation-delay: .15s } .b3 { animation-delay: .3s } .b4 { animation-delay: .45s }
      @keyframes bar { 0% { transform: scaleY(.3) } 45%, 80% { transform: scaleY(1) } 100% { transform: scaleY(.3) } }
      .bag { animation: bob 2.8s ease-in-out infinite; }
      @keyframes bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-3px) } }
      .spark { transform-box: fill-box; transform-origin: center; animation: spark 2.8s ease-in-out infinite; }
      @keyframes spark { 0%, 100% { transform: scale(.3) rotate(0); opacity: 0 } 50% { transform: scale(1) rotate(45deg); opacity: 1 } }
      .ring { animation: ring 3.6s cubic-bezier(.5,0,.3,1) infinite; }
      @keyframes ring { 0% { stroke-dashoffset: 94 } 55%, 80% { stroke-dashoffset: 30 } 100% { stroke-dashoffset: 94 } }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .rise { opacity: 1; } .vl, .hl { transform: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="516" rx="20" fill="#faf8f4"/>
  <rect x=".5" y=".5" width="1199" height="515" rx="19.5" fill="none" stroke="#e4dfd4"/>

  <rect x="48" y="38" width="8" height="8" fill="#ec2a3f"/>
  <text class="mono" x="66" y="46" font-size="11.5" font-weight="700" fill="#17150f" letter-spacing="2.4">FIG. 2 — FITUR UTAMA</text>
  <text class="mono" x="1152" y="46" font-size="11" fill="#857f73" letter-spacing="1.4" text-anchor="end">6 kemampuan inti · 15 fitur total</text>

  <g filter="url(#card)"><rect x="48" y="70" width="1104" height="416" rx="16" fill="#fff" stroke="#ddd7ca"/></g>
  <rect class="vl" x="415.5" y="94" width="1" height="368" fill="#e4dfd4"/>
  <rect class="vl" x="783.5" y="94" width="1" height="368" fill="#e4dfd4"/>
  <rect class="hl" x="72" y="277.5" width="1056" height="1" fill="#e4dfd4"/>

  <!-- 01 -->
  <g class="rise r1">
    <text class="mono no" x="76" y="108">N° 01</text>
    <g transform="translate(352 86)">
      <g fill="#17150f"><rect x="4" y="6" width="2" height="24"/><rect x="8" y="6" width="4" height="24"/><rect x="14" y="6" width="2" height="24"/><rect x="18" y="6" width="3" height="24"/><rect x="23" y="6" width="2" height="24"/><rect x="27" y="6" width="4" height="24"/></g>
      <rect class="laser" x="0" y="6" width="36" height="2" rx="1" fill="#ec2a3f"/>
    </g>
    <text class="serif t" x="76" y="164">Scan Barcode</text>
    <text class="sans d" x="76" y="194">Scanner USB langsung jalan tanpa</text>
    <text class="sans d" x="76" y="216">driver; barcode asing memberi notifikasi.</text>
    <text class="mono g" x="76" y="250">— keyboard wedge · input manual</text>
  </g>

  <!-- 02 -->
  <g class="rise r2">
    <text class="mono no" x="444" y="108">N° 02</text>
    <g transform="translate(720 86)">
      <path class="ic shackle" d="M11 16v-4a7 7 0 0 1 14 0v4"/>
      <rect class="ic" x="6" y="16" width="24" height="17" rx="4"/>
      <circle class="key" cx="18" cy="24.5" r="2.4" fill="#857f73"/>
    </g>
    <text class="serif t" x="444" y="164">Transaksi Atomik</text>
    <text class="sans d" x="444" y="194">Stok dan transaksi tersimpan bersama,</text>
    <text class="sans d" x="444" y="216">atau tidak tersimpan sama sekali.</text>
    <text class="mono g" x="444" y="250">— diuji dengan 12 checkout serentak</text>
  </g>

  <!-- 03 -->
  <g class="rise r3">
    <text class="mono no" x="812" y="108">N° 03</text>
    <g transform="translate(1088 86)">
      <g class="ic" stroke-width="1.5"><rect x="4" y="4" width="10" height="10" rx="2"/><rect x="22" y="4" width="10" height="10" rx="2"/><rect x="4" y="22" width="10" height="10" rx="2"/></g>
      <g fill="#17150f"><rect x="22" y="22" width="3.5" height="3.5"/><rect x="28" y="22" width="3.5" height="3.5"/><rect x="22" y="28" width="3.5" height="3.5"/><rect x="16.2" y="16.2" width="3.5" height="3.5"/></g>
      <g clip-path="url(#c1)"><rect class="qscan" x="2" y="4" width="32" height="2" rx="1" fill="#ec2a3f"/></g>
    </g>
    <text class="serif t" x="812" y="164">QRIS Jujur</text>
    <text class="sans d" x="812" y="194">Terverifikasi, manual, atau ditolak —</text>
    <text class="sans d" x="812" y="216">tak pernah ada QR hiasan yang palsu.</text>
    <text class="mono g" x="812" y="250">— Midtrans · QRIS statis merchant</text>
  </g>

  <!-- 04 -->
  <g class="rise r4">
    <text class="mono no" x="76" y="316">N° 04</text>
    <g transform="translate(352 294)">
      <rect class="bar b1" x="5" y="20" width="5" height="12" rx="1" fill="#17150f"/>
      <rect class="bar b2" x="12.5" y="12" width="5" height="20" rx="1" fill="#17150f"/>
      <rect class="bar b3" x="20" y="16" width="5" height="16" rx="1" fill="#17150f"/>
      <rect class="bar b4" x="27.5" y="5" width="5" height="27" rx="1" fill="#ec2a3f"/>
      <path d="M2 33.5h32" stroke="#17150f" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <text class="serif t" x="76" y="372">Laporan Laba</text>
    <text class="sans d" x="76" y="402">Pemasukan vs pengeluaran, laba kotor</text>
    <text class="sans d" x="76" y="424">&amp; bersih, dan unit terjual per produk.</text>
    <text class="mono g" x="76" y="458">— filter periode · ekspor CSV</text>
  </g>

  <!-- 05 -->
  <g class="rise r5">
    <text class="mono no" x="444" y="316">N° 05</text>
    <g transform="translate(720 294)">
      <g class="bag">
        <path class="ic" d="M6 12h24l-2 19a2.6 2.6 0 0 1-2.6 2.3H10.6A2.6 2.6 0 0 1 8 31z"/>
        <path class="ic" d="M12.5 16v-5a5.5 5.5 0 0 1 11 0v5"/>
      </g>
      <path class="spark" d="M31 1l1.2 2.8L35 5l-2.8 1.2L31 9l-1.2-2.8L27 5l2.8-1.2z" fill="#ec2a3f"/>
    </g>
    <text class="serif t" x="444" y="372">Etalase Online</text>
    <text class="sans d" x="444" y="402">Katalog publik, keranjang, ambil di</text>
    <text class="sans d" x="444" y="424">toko atau diantar — satu sumber stok.</text>
    <text class="mono g" x="444" y="458">— /toko.html · tanpa akun</text>
  </g>

  <!-- 06 -->
  <g class="rise r6">
    <text class="mono no" x="812" y="316">N° 06</text>
    <g transform="translate(1088 294)">
      <circle cx="18" cy="18" r="15" fill="none" stroke="#17150f" stroke-opacity=".12" stroke-width="2.5"/>
      <circle class="ring" cx="18" cy="18" r="15" fill="none" stroke="#ec2a3f" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="94" stroke-dashoffset="30" transform="rotate(-90 18 18)"/>
      <path class="ic" stroke-width="1.5" d="M18 11.5l6 3.1v6.8L18 24.5l-6-3.1v-6.8zM12 14.6l6 3.1 6-3.1M18 17.7v6.8"/>
    </g>
    <text class="serif t" x="812" y="372">Stok Terkunci</text>
    <text class="sans d" x="812" y="402">Pesanan online mengunci stok; dilepas</text>
    <text class="sans d" x="812" y="424">saat batal, dipotong saat selesai.</text>
    <text class="mono g" x="812" y="458">— tersedia = stok − stokDipesan</text>
  </g>
</svg>
