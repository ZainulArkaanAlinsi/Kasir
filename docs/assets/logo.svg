<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Logo KasirOne">
  <title>KasirOne</title>
  <defs>
    <!-- Bentuk struk: sudut atas membulat, tepi bawah bergerigi seperti kertas yang disobek -->
    <path id="receipt" d="M48 72 Q48 36 84 36 H172 Q208 36 208 72 V208 L198 220 L188 208 L178 220 L168 208 L158 220 L148 208 L138 220 L128 208 L118 220 L108 208 L98 220 L88 208 L78 220 L68 208 L58 220 L48 208 Z"/>
    <clipPath id="clip"><use href="#receipt"/></clipPath>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <style>
      .shine { animation: sweep 5.5s cubic-bezier(.6,0,.2,1) infinite; }
      @keyframes sweep { 0%,62% { transform: translateX(-120px) skewX(-18deg) } 100% { transform: translateX(260px) skewX(-18deg) } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
    </style>
  </defs>

  <use href="#receipt" fill="#ec2a3f"/>
  <g clip-path="url(#clip)">
    <rect class="shine" x="0" y="20" width="60" height="220" fill="url(#shine)"/>
  </g>
  <g fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <path d="M98 76v92"/>
    <path d="M160 76l-54 52"/>
    <path d="M124 112l38 56"/>
  </g>
  <path d="M80 194h96" stroke="#fff" stroke-opacity=".55" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 8"/>
</svg>
